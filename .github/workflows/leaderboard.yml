name: Leaderboard

# Serverless global leaderboard: players open an issue titled
#   SCORE: <code> <story|endless> <madreiga>
# where <code> comes from the game-over/victory screen. This workflow
# validates the code, records the score in leaderboard.json (which the app
# fetches anonymously from raw.githubusercontent.com), and closes the issue.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: startsWith(github.event.issue.title, 'SCORE:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and record score
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = context.payload.issue.title;
            const author = context.payload.issue.user.login;
            const close = async (msg) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: msg
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed'
              });
            };
            const m = title.match(/^SCORE:\s*(\d+)-(\d+)\s+(story|endless)\s+(kvetch|baal_habos|masmid|gadol_hador)(?:\s+([A-Za-z0-9_-]{1,20}))?\s*$/i);
            if (!m) {
              await close('Invalid format. Expected: `SCORE: <code> <story|endless> <madreiga> [name]` — the code is shown on the game-over and victory screens.');
              return;
            }
            // In-game auto-submissions carry the player handle in the title;
            // manual submissions fall back to the issue author's login.
            const playerName = m[5] || author;
            const score = parseInt(m[1], 10);
            const check = parseInt(m[2], 10);
            const expected = Number((BigInt(score) * 7919n + 5747n) % 99991n);
            if (check !== expected) {
              await close('Checksum mismatch. Nice try. The Menahel is watching.');
              return;
            }
            const path = 'leaderboard.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const mode = m[3].toLowerCase();
            // One entry per player per mode: keep only their best
            const existing = data.entries.find(e => e.name === playerName && e.mode === mode);
            if (existing && existing.score >= score) {
              await close(`You already have ${existing.score} on the board for ${mode} — this ${score} doesn't beat it. Chazak v'ematz.`);
              return;
            }
            data.entries = data.entries.filter(e => !(e.name === playerName && e.mode === mode));
            data.entries.push({
              name: playerName,
              score: score,
              mode: mode,
              difficulty: m[4].toUpperCase(),
              date: new Date().toISOString().slice(0, 10)
            });
            data.entries.sort((a, b) => b.score - a.score);
            data.entries = data.entries.slice(0, 50);
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
            core.exportVariable('SCORE_VALID', '1');
            await close(`Score **${score}** (${mode}, ${m[4].toUpperCase()}) recorded for ${playerName}. Mamash a kiddush hashem.`);

      - name: Commit updated leaderboard
        if: env.SCORE_VALID == '1'
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add leaderboard.json
          git commit -m "Record leaderboard score" || exit 0
          # Retry once in case two submissions race
          git pull --rebase origin main
          git push || (git pull --rebase origin main && git push)
