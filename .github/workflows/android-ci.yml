name: Android CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (e.g. v2.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          LEADERBOARD_TOKEN: ${{ secrets.LEADERBOARD_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: escape-your-menahel-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Pushing a tag (e.g. v2.0.0) publishes a GitHub Release with the APK;
      # a manual dispatch with release_tag does the same and creates the tag
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Escape Your Menahel ${{ github.event.inputs.release_tag || github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
