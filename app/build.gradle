plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.escapegame"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
        // Injected by CI from the LEADERBOARD_TOKEN Actions secret (a
        // fine-grained PAT with issues:write on this repo only). Empty in
        // local builds: the app then falls back to manual score submission.
        // The leaderboard is entirely optional - no internet needed to play.
        buildConfigField "String", "LEADERBOARD_TOKEN", "\"${System.getenv('LEADERBOARD_TOKEN') ?: ''}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the auto-generated debug key so CI produces an
            // installable release APK without needing keystore secrets
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}